name: Windows installer and packaged app
on:
  push:
    branches: [codex/growthbrain-recovery-20261103]
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-package-${{ github.ref }}
  cancel-in-progress: true
jobs:
  go-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: integrations/windows-route/go.mod
          cache-dependency-path: '**/go.sum'
      - name: Test TLS passthrough
        working-directory: integrations/windows-route
        run: go test -tags=ts_omit_logtail ./...
      - name: Test installer transactions
        run: go test ./...
        working-directory: windows/setup
      - name: Test desktop state and service link handling
        working-directory: windows/desktop
        run: GO111MODULE=off go test
  windows-smoke:
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: integrations/windows-route/go.mod
          cache: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
      - run: npm.cmd ci
      - name: Build the temporary installer for this runner
        run: python scripts/build-windows-installer.py --output (Join-Path $env:RUNNER_TEMP GrowthBrain-Setup-x64.exe)
      - name: Verify the bundled payload and install/update/remove
        working-directory: windows/setup
        run: |
          $env:GROWTH_BRAIN_TEST_INSTALLER = Join-Path $env:RUNNER_TEMP GrowthBrain-Setup-x64.exe
          go test -v -count=1 ./...
      - name: Test current-user native registration and preservation
        run: go test ./...
        working-directory: windows/native
      - name: Install, update, remove and exercise the packaged app
        shell: pwsh
        run: |
          $setup = Resolve-Path (Join-Path $env:RUNNER_TEMP GrowthBrain-Setup-x64.exe)
          $root = Join-Path $env:RUNNER_TEMP 'GB-package-smoke'
          $packageCheck = Start-Process $setup -ArgumentList '--smoke-test' -PassThru -Wait
          if ($packageCheck.ExitCode -ne 0) { throw "Setup lifecycle failed ($($packageCheck.ExitCode))" }
          $extract = Start-Process $setup -ArgumentList @('--smoke-test', ('"' + $root + '"')) -PassThru -Wait
          if ($extract.ExitCode -ne 0) { throw "Setup extraction failed ($($extract.ExitCode))" }
          $app = Join-Path $root app
          & (Join-Path $app node.exe) test/windows-package-smoke.mjs $app
          if ($LASTEXITCODE -ne 0) { throw 'Packaged vault smoke failed' }
          # Tests import ../dist from the checkout. Use the bundled code and production
          # modules; keep development dependencies aside for the SQL fixture only.
          Rename-Item -LiteralPath node_modules -NewName ci-build-deps
          Copy-Item -Recurse (Join-Path $app dist) ./dist
          Copy-Item -Recurse (Join-Path $app node_modules) ./node_modules
          & (Join-Path $app node.exe) --test test/windows-storage.test.mjs test/windows-native.test.mjs test/windows-trust.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Windows storage or native host check failed' }
          ./test/windows-desktop-smoke.ps1 -App (Join-Path $app GrowthBrain.exe)
      - name: Exercise offline reconciliation and cross-device recall with both HTTPS MCP clients
        shell: pwsh
        run: |
          $null = New-Item -ItemType Directory -Path node_modules/@electric-sql
          Copy-Item -Recurse ci-build-deps/@electric-sql/pglite node_modules/@electric-sql/pglite
          $runtime = Join-Path $env:RUNNER_TEMP 'GB-package-smoke/app/node.exe'
          & $runtime --test test/account-offline-sync.test.mjs test/desktop-offline.test.mjs test/multi-device-sync.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Windows multi-device acceptance failed' }
      - name: Exercise the normal Windows setup dialogs and Start menu entry
        shell: pwsh
        run: ./test/windows-setup-dialogs.ps1 -Setup (Resolve-Path (Join-Path $env:RUNNER_TEMP GrowthBrain-Setup-x64.exe)).Path

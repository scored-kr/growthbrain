name: Local contracts and release artifacts
on:
  push:
    branches: [main, codex/growthbrain-recovery-20261103]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: local-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:local
      - run: npm run validate:extension
      - run: git diff --exit-code -- extension/account-auth.js
      - run: python3 scripts/package-release.py build/release
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: growth-brain-${{ github.sha }}
          path: build/release/
          retention-days: 14
          if-no-files-found: error

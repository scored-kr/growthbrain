<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>Growth Brain</title><link rel="stylesheet" href="popup.css"></head>
<body><h1>Growth Brain</h1><p>동의한 사이트의 대화만 로컬 암호화 금고에 수집합니다. AI에 전달한 기억은 해당 AI가 읽을 수 있습니다.</p>
<p id="status" role="status">로컬 금고 연결 확인 중…</p>
<label>사이트 <select id="site"><option value="chatgpt.com">ChatGPT</option><option value="claude.ai">Claude</option></select></label>
<label>프로젝트 <select id="project"><option value="">선택하세요</option></select></label>
<p id="capture-state"></p>
<button id="enable">이 사이트 수집에 동의하고 시작</button><button id="stop">수집 중지</button><button id="refresh">새로고침</button>
<h2>기억 검토</h2><p>승인 전 후보는 AI 조회에 사용되지 않습니다. 내용을 확인한 뒤 승인하세요.</p>
<label>보기 <select id="filter"><option value="candidate">승인 대기</option><option value="active">확정 기억</option><option value="all">전체 상태</option></select></label>
<div id="memories"></div><button id="more" hidden>다음 항목</button>
<p>잠금 해제·금고 생성·백업·전체 삭제는 사용자 로컬 터미널에서 진행하세요. 비밀번호나 복구 키를 AI에 전달하지 마세요.</p>
<script src="popup.js" type="module"></script></body></html>

<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Growth Brain · 계정 연결</title><link rel="stylesheet" href="app.css"></head><body>
<header><a class="brand" href="app.html">Growth Brain</a><span>계정 연결</span></header>
<main><h1>계정 연결</h1><p>계정 비밀번호와 로컬 금고 비밀번호는 별개입니다. 가입·로그인·계정 비밀번호 재설정은 금고를 열거나 금고 키를 변경하지 않습니다.</p><p id="account-status" role="status" aria-live="polite"></p><p id="account-identity"></p>
<label>진행할 작업 <select id="account-mode"><option value="signIn">로그인</option><option value="signUp">회원가입</option><option value="verifyEmail">이메일 확인</option><option value="requestPasswordReset">계정 비밀번호 재설정 요청</option><option value="confirmPasswordReset">새 계정 비밀번호 설정</option></select></label>
<form id="account-form"><label id="email-label">이메일<input id="account-email" type="email" autocomplete="email" maxlength="254"></label><label id="code-label" hidden>이메일 확인 코드<input id="account-code" type="password" autocomplete="one-time-code" maxlength="2048"></label><label id="password-label">계정 비밀번호<input id="account-password" type="password" autocomplete="current-password" minlength="12" maxlength="1024"></label><label id="confirm-label" hidden>계정 비밀번호 확인<input id="account-confirm" type="password" autocomplete="new-password" minlength="12" maxlength="1024"></label><button type="submit" class="primary" id="account-submit">계속</button></form>
<div class="actions"><button id="account-refresh" hidden>계정 세션 갱신</button><button id="account-logout" hidden>로그아웃</button></div>
<p class="hint">이메일 확인·재설정 코드는 이 계정 화면에만 입력하세요. 비밀번호·복구 키·인증 코드를 AI 채팅에 보내지 마세요. 로컬 금고 비밀번호를 잊었다면 별도의 복구 파일과 암호문 백업이 필요합니다.</p></main><script type="module" src="account-page.js"></script></body></html>
